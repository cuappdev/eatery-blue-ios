name: Sync PRs to Notion
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, dismissed, edited]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pull-requests: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Trusted script is checked out from the repository default branch, never PR head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sync to Notion
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/sync_pr.py
