name: Sync PRs to Notion

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
      - closed
      - review_requested
      - review_request_removed

  pull_request_review:
    types:
      - submitted
      - dismissed
      - edited

  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: notion-pr-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync GitHub PRs to Notion
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Always use trusted code from the default branch.
      # Never execute code from an incoming PR.
      - name: Checkout trusted repository code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate configuration
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::Missing NOTION_TOKEN secret"
            exit 1
          fi

          if [ -z "$NOTION_DATABASE_ID" ]; then
            echo "::error::Missing NOTION_DATABASE_ID variable"
            exit 1
          fi

      - name: Sync pull requests to Notion
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/sync_pr.py
