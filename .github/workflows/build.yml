name: Eatery Blue
permissions:
  contents: read

on:
  pull_request:
    branches: ['main', 'release']
  push:
    branches: ['main', 'release']

jobs:
  build:
    name: Build Production Scheme
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run post_clone
        env:
          SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          CI_WORKSPACE: ${{ github.workspace }}
        run: |
          chmod +x ./ci_scripts/ci_post_clone.sh
          ./ci_scripts/ci_post_clone.sh

      - name: Build
        env:
          scheme: Eatery Blue-Prod
          platform: iOS Simulator
        run: |
          set -euo pipefail

          device="$(
            xcrun simctl list devices available |
              awk -F '(' '/^[[:space:]]*iPhone/{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit}'
          )"

          if [ -z "$device" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator: $device"

          if ls -A | grep -qi '\.xcworkspace$'; then
            filetype_parameter="workspace"
            file_to_build="$(ls -A | grep -i '\.xcworkspace$' | head -n 1)"
          else
            filetype_parameter="project"
            file_to_build="$(ls -A | grep -i '\.xcodeproj$' | head -n 1)"
          fi

          xcodebuild build-for-testing \
            -scheme "$scheme" \
            "-$filetype_parameter" "$file_to_build" \
            -destination "platform=$platform,name=$device,OS=latest" \
            -skipPackagePluginValidation